[tools]
bun = "1.4.2"

[tasks.lint]
description = "Lint all JS sources"
run = "bun run lint"

[tasks.dev]
description = "Run lazymise from source"
run = "bun run dev"

[tasks.check]
description = "Run all checks"
depends = [
  "lint",
  "test"
]

[tasks.test]
description = "Run the Bun test suite"
run = "bun test --timeout 30000"

[tasks.build]
description = "Build the host-native standalone release"
run = "bun run build"

[tasks."smoke:release"]
description = "Exercise the standalone archive in an isolated fixture"
run = "bun run smoke:release"
