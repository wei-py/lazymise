[tools]
node = "26.7.0"
pnpm = "12.5.1"

[tasks.lint]
description = "Lint all JS sources"
run = "pnpm lint"

[tasks.dev]
description = "Run lazymise from source"
run = "pnpm dev"

[tasks.check]
description = "Run all checks"
depends = [
  "lint",
  "test"
]

[tasks.test]
description = "Run the Node test suite"
run = "pnpm test"

[tasks.build]
description = "Build the host-native standalone release"
run = "pnpm build"

[tasks."smoke:release"]
description = "Exercise the standalone archive in an isolated fixture"
run = "pnpm smoke:release"
