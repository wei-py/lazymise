name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        default: v1.1.1
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build and smoke ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux-x86_64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            asset: linux-aarch64
            archive: tar.gz
          - os: macos-15
            asset: macos-aarch64
            archive: tar.gz
          - os: macos-15-intel
            asset: macos-x86_64
            archive: tar.gz
          - os: windows-latest
            asset: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run runtime tests
        run: node --test src/runtime.test.js src/ffi.test.js
      - name: Run TUI regressions
        if: runner.os != 'Windows'
        run: pnpm test
      - name: Build host-native standalone archive
        run: pnpm build
      - name: Exercise extracted standalone release
        run: pnpm smoke:release
      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/lazymise-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum lazymise-* > SHA256SUMS
      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lazymise-*
            dist/SHA256SUMS
