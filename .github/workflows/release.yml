name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            archive: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            asset: macos-x86_64
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install mise toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
          cache: true
          # Keep this version in sync with mise.toml so older tags can be rebuilt.
          mise_toml: |
            [tools]
            rust = { version = "1.94.0", profile = "minimal" }

      - name: Install Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}

      - name: Run tests
        run: mise exec -- cargo test --locked

      - name: Build release binary
        run: mise exec -- cargo build --locked --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="lazymise-${RELEASE_TAG}-${{ matrix.asset }}"
          mkdir -p "${package}"
          cp "target/${{ matrix.target }}/release/lazymise" "${package}/"
          cp README.md LICENSE "${package}/"
          tar -czf "${package}.tar.gz" "${package}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "lazymise-$env:RELEASE_TAG-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lazymise.exe" "$package/"
          Copy-Item README.md, LICENSE "$package/"
          Compress-Archive -Path $package -DestinationPath "$package.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: lazymise-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum lazymise-* > SHA256SUMS

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lazymise-*
            dist/SHA256SUMS
