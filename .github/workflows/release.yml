name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check tag matches package version
        run: bun scripts/check-release-tag.js

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux-x86_64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            asset: linux-aarch64
            archive: tar.gz
          - os: macos-15
            asset: macos-aarch64
            archive: tar.gz
          - os: macos-15-intel
            asset: macos-x86_64
            archive: tar.gz
          - os: windows-latest
            asset: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
      - name: Run runtime tests
        run: bun test src/runtime.test.js src/ffi.test.js
      - name: Run TUI regressions
        if: runner.os != 'Windows'
        run: bun run test
      - name: Build host-native standalone archive
        run: bun run build
      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/lazymise-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum lazymise-* > SHA256SUMS
      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lazymise-*
            dist/SHA256SUMS
